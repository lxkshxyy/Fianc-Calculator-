<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is required by §10.3: without it every env(safe-area-inset-*)
      resolves to 0px and the bottom tab bar sits under the home indicator.
      Never add user-scalable=no or maximum-scale=1 — they break §2.1.10.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Wealth Rebuild Circle — personal finance and wealth building." />
    <title>Wealth Rebuild Circle</title>
    <!-- The tab icon and home-screen icon. Without these a browser asks for /favicon.ico,
         which does not exist, and shows a blank globe in the tab. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
